[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-orchestration"
version = "0.8.1"
description = "Public Observer client and contracts for external Loom orchestration"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "httpcore>=1.0,<2", "websockets>=15,<18", "jsonschema>=4.23,<5", "rfc8785>=0.1,<1"]

[project.optional-dependencies]
auth = ["playwright==1.64.0"]

[project.scripts]
loom-auth = "loom_orchestration.auth:main"

[tool.setuptools]
package-dir = {"" = "../.."}

[tool.setuptools.packages.find]
where = ["../.."]
include = ["loom_orchestration*"]
