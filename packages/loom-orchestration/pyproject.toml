[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-orchestration"
version = "0.1.0"
description = "Public Observer client and contracts for external Loom orchestration"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "../.."}

[tool.setuptools.packages.find]
where = ["../.."]
include = ["loom_orchestration*"]
