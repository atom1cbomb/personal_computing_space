[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-v2"
version = "0.1.0"
description = "Single-user single-Workspace compute closure runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1,<1",
  "pyright[nodejs]==1.1.411",
]

[project.optional-dependencies]
test = [
  "setuptools>=68",
  "wheel>=0.45",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "moto[s3]>=5,<6",
  "pillow>=11,<12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: requires a running PostgreSQL service",
  "e2e: requires the deployed Docker Compose stack",
]

[tool.setuptools.packages.find]
include = ["loom_v2*", "loom_orchestration*", "migrations*"]

[tool.setuptools.package-data]
loom_v2 = ["web/static/*", "mcue_types/*.json"]
