# Controlled heterogeneity for scheduler experiments on one Docker host.
# Use together with deploy/docker-compose.yml; this is not evidence of real
# CPU/GPU heterogeneity.
services:
  driver:
    environment:
      LOOM_SCHEDULING_POLICY: ${LOOM_SCHEDULING_POLICY:-round_robin_v1}
    volumes:
      - ${LOOM_SOURCE_PATH:-../loom_v2}:/app/loom_v2:ro

  observer:
    volumes:
      - ${LOOM_SOURCE_PATH:-../loom_v2}:/app/loom_v2:ro

  slave-a:
    cpus: 0.5
    environment:
      LOOM_RUNTIME_PLUGIN_CPUS: "0.4"
      LOOM_RUNTIME_PLUGIN_MAX_CONCURRENCY: "1"
      LOOM_SCHEDULING_PROFILES: '{"default":{"capacity":1,"service_time_ms":600,"cold_start_ms":0},"packages":{"image-preprocess-http":{"capacity":1,"service_time_ms":300,"cold_start_ms":500},"yolo11n-http":{"capacity":1,"service_time_ms":1600,"cold_start_ms":1500},"inspection-assess-risk":{"capacity":1,"service_time_ms":80,"cold_start_ms":0},"inspection-aggregate":{"capacity":1,"service_time_ms":120,"cold_start_ms":0}}}'
    volumes:
      - ${LOOM_SOURCE_PATH:-../loom_v2}:/app/loom_v2:ro

  slave-b:
    cpus: 1.5
    environment:
      LOOM_RUNTIME_PLUGIN_CPUS: "1.0"
      LOOM_RUNTIME_PLUGIN_MAX_CONCURRENCY: "2"
      LOOM_SCHEDULING_PROFILES: '{"default":{"capacity":1,"service_time_ms":300,"cold_start_ms":0},"packages":{"image-preprocess-http":{"capacity":1,"service_time_ms":150,"cold_start_ms":500},"yolo11n-http":{"capacity":1,"service_time_ms":700,"cold_start_ms":1500},"inspection-assess-risk":{"capacity":1,"service_time_ms":50,"cold_start_ms":0},"inspection-aggregate":{"capacity":1,"service_time_ms":80,"cold_start_ms":0}}}'
    volumes:
      - ${LOOM_SOURCE_PATH:-../loom_v2}:/app/loom_v2:ro

  slave-c:
    cpus: 3.0
    environment:
      LOOM_RUNTIME_PLUGIN_CPUS: "2.5"
      LOOM_RUNTIME_PLUGIN_MAX_CONCURRENCY: "4"
      LOOM_SCHEDULING_PROFILES: '{"default":{"capacity":1,"service_time_ms":150,"cold_start_ms":0},"packages":{"image-preprocess-http":{"capacity":1,"service_time_ms":80,"cold_start_ms":500},"yolo11n-http":{"capacity":1,"service_time_ms":300,"cold_start_ms":1500},"inspection-assess-risk":{"capacity":1,"service_time_ms":30,"cold_start_ms":0},"inspection-aggregate":{"capacity":1,"service_time_ms":50,"cold_start_ms":0}}}'
    volumes:
      - ${LOOM_SOURCE_PATH:-../loom_v2}:/app/loom_v2:ro
