# Copy this file, create the referenced local secret files, and run:
#   python scripts/deploy_cluster.py --config deploy/deployment.example.toml

[cluster]
name = "loom-prod"
remote_dir = "/opt/loom-v2"
workspace_id = "workspace-default"
# Public resource namespace and Observer origin (TLS may terminate at a proxy).
grip_authority = "loom.example.com"
public_base_url = "https://loom.example.com"
# Configure this file to enable GRIP; it is mounted only on the Observer.
# grip_token_file = "../secrets/grip_token"
# Optional Dockerfile build network: default, host, or none. Use host only
# when the target Docker bridge cannot resolve package mirrors.
build_network = "default"
# Optional host directory containing operator-managed runtime credential profiles.
# runtime_credentials_dir = "/var/lib/loom/runtime-credentials"
# Optional pre-created Docker bridge network for packages with network_profile=egress.
# runtime_plugin_egress_network = "loom-egress"
internal_secret_file = "../secrets/internal_api_secret"
postgres_password_file = "../secrets/postgres_password"
minio_access_key = "loom"
minio_secret_key_file = "../secrets/minio_secret_key"

[driver]
workspace_path = "/srv/loom/workspace"

[[machines]]
name = "storage"
ssh_host = "10.0.0.10"
ssh_port = 22
ssh_user = "ubuntu"
role = "minio"
service_port = 9000
console_port = 9001

[[machines]]
name = "observer"
ssh_host = "10.0.0.11"
ssh_port = 22
ssh_user = "ubuntu"
role = "observer"
service_port = 8080

[[machines]]
name = "driver"
ssh_host = "10.0.0.12"
ssh_port = 22
ssh_user = "ubuntu"
role = "driver"
service_port = 8090

[[machines]]
name = "slave-a"
ssh_host = "10.0.0.13"
ssh_port = 22
ssh_user = "ubuntu"
role = "slave"
service_id = "slave-a"
service_port = 8081
# Declare the exact host URI discovered in this workspace. The selected MCUE
# defines its meaning and required fields; no host is inferred from ssh_host.
# resource_metadata = { mcue_ref = "grip://loom.example.com/workspaces/workspace-default/mcue-types/computing/slave/v2", attributes = { host_resource = "grip://loom.example.com/workspaces/workspace-default/resources/vm/actual-host" } }

[[machines]]
name = "slave-b"
ssh_host = "10.0.0.14"
ssh_port = 22
ssh_user = "ubuntu"
role = "slave"
service_id = "slave-b"
service_port = 8082
