<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loom v2 Execution</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <section class="conversation">
      <header><h1>Loom v2</h1><span id="agent-status">Execution Driver loading…</span></header>
      <p>Submit a complete JSON ClosureContract generated by your external agent.</p>
      <form id="submission-form">
        <label>Workspace URI <input id="workspace-uri" required value="grip://loom.local/workspaces/workspace-default"></label>
        <label>Workspace token <input id="grip-token" type="password" autocomplete="off" required></label>
        <label>Submission key <input id="request-id" required placeholder="request-opaque"></label>
        <label>Closure JSON <textarea id="plan" required placeholder='{"closure_id":"...","goal":"...","body":{}}'></textarea></label>
        <button>Queue execution</button>
      </form>
    </section>
    <aside class="drawer">
      <h2>Run</h2>
      <label>Run URI <input id="run-id" placeholder="grip://…/runs/…"></label>
      <button id="refresh-run" type="button">Refresh</button>
      <p id="run-status">—</p>
      <pre id="run-output">—</pre>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
